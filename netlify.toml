[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# Breadcrumbs on every locality guide link "California" and the city name to
# these paths (see buildBreadcrumbItems in src/lib/locality-guide.ts) but no
# Astro page exists at any of them — only the *-solar-permit-guide/ pages and
# the guide index do. Redirect rather than change the breadcrumb API, which
# would ripple through the page generator, every generated page, and their
# tests. Add one more entry here for each new city added to
# src/pages/california/.
[[redirects]]
  from = "/california/"
  to = "/california/solar-permit-guides/"
  status = 301
  force = true

