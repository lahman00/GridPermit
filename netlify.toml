[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# Breadcrumbs on every locality guide link the city name to this path (see
# buildBreadcrumbItems in src/lib/locality-guide.ts) but no Astro page
# exists there — only the *-solar-permit-guide/ page and the guide index
# do. ("California" no longer needs a redirect here — src/pages/california/
# index.astro is now a real page.) Redirect rather than change the
# breadcrumb API, which would ripple through the page generator, every
# generated page, and their tests. Add one more entry here for each new
# city added to src/pages/california/.
[[redirects]]
  from = "/california/oakland/"
  to = "/california/oakland/solar-permit-guide/"
  status = 301
  force = true

