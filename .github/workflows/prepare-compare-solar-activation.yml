name: Prepare CompareSolarPrices activation

on:
  push:
    branches:
      - feat/compare-solar-activation-ready

permissions:
  contents: write

jobs:
  activate:
    if: contains(github.event.head_commit.message, '[activate-compare-solar]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/compare-solar-activation-ready
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate activation state
        run: node scripts/prepare-compare-solar-activation.mjs
      - name: Commit generated activation
        run: |
          git config user.name "gridpermit-activation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No activation changes produced"
            exit 1
          fi
          git commit -m "monetization: activate CompareSolarPrices after verified handoff"
          git push origin HEAD:feat/compare-solar-activation-ready
