name: Reconcile CompareSolarPrices live verification

on:
  push:
    branches: ["docs/reconcile-comparesolar-live-verification"]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch canonical state deterministically
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/MONETIZATION_CANONICAL_STATE.md')
          text = path.read_text()

          old_row = "| **CompareSolarPrices** | CPL + installation conversion | `PRODUCTION_ACTIVE` | Directly confirmed: $25 qualified quote request, $200 funded installation conversion, Southern California, 30-day click-to-quote attribution; once attached, install conversion has no stated time limit. Dedicated `ref=GridPermit` + fresh non-PII `cid` per click is the approved tracking mechanism. PayPal selected; Aaron confirmed Israel/PayPal are accepted, received the PayPal-account email, and explicitly cleared GridPermit to put the referral link live. | Production route is deliberately enabled only for the verified Southern California locality allowlist. W-8BEN remains a separate tax-file follow-up and is not a launch blocker. Continue real-click/no-fake-lead verification and payout reconciliation. Issue #5. |"
          new_row = "| **CompareSolarPrices** | CPL + installation conversion | `PRODUCTION_ACTIVE` | Directly confirmed: $25 qualified quote request, $200 funded installation conversion, Southern California, 30-day click-to-quote attribution; once attached, install conversion has no stated time limit. Dedicated `ref=GridPermit` + fresh non-PII `cid` per click is the approved tracking mechanism. PayPal selected; Aaron confirmed Israel/PayPal are accepted, received the PayPal-account email, and explicitly cleared GridPermit to put the referral link live. External production verification completed 2026-08-26: the eligible Irvine page returned HTTP 200 and rendered the paid CTA/disclosure; one real outbound click produced the correct city deep link, `ref=GridPermit`, and a valid 24-character non-PII CID without form submission; the noneligible Oakland page returned HTTP 200, did not render CompareSolarPrices, and retained one plain untracked EnergySage fallback. | Production routing remains limited to the verified Southern California locality allowlist. Reconcile real partner reporting and payouts as genuine traffic converts. W-8BEN remains a separate nonblocking tax-file follow-up. Issue #5 is complete and closed. |"

          old_priority = "1. **CompareSolarPrices** — production-active. Verify the merged production deployment, one real outbound click with a fresh CID and no fake quote submission, then reconcile actual partner reporting/payouts as real traffic arrives."
          new_priority = "1. **CompareSolarPrices** — production-active and externally verified on 2026-08-26 with one real outbound click and no form submission. Reconcile actual partner reporting and payouts as genuine traffic arrives."

          old_status = "The existing EnergySage fallback remains a plain, untracked destination and must not be described as an earning link. Outside the verified CompareSolarPrices geography, production behavior continues to fall back safely."
          new_status = "The existing EnergySage fallback remains a plain, untracked destination and must not be described as an earning link. Outside the verified CompareSolarPrices geography, production behavior continues to fall back safely. A one-time GitHub-hosted Playwright smoke test completed on 2026-08-26 and evidenced the eligible CTA/disclosure, correct outbound city/ref/CID contract, no form submission, and the noneligible plain fallback."

          for old, new, label in [
              (old_row, new_row, 'partner row'),
              (old_priority, new_priority, 'priority line'),
              (old_status, new_status, 'production status'),
          ]:
              if old not in text:
                  raise SystemExit(f'Expected {label} text not found; refusing partial patch')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit canonical reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MONETIZATION_CANONICAL_STATE.md
          git commit -m "docs: record CompareSolarPrices live production verification"
          git push origin HEAD:${{ github.ref_name }}
