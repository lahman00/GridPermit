name: SGIP locality data migration

on:
  push:
    branches: ["fix/sgip-2026-data"]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh SGIP locality records
        run: npm run sgip-refresh

      - name: Verify SGIP freshness
        run: npm run sgip-check

      - name: Validate all locality data
        run: npm run data-quality-check

      - name: Run unit and integration tests
        run: npm test

      - name: Commit deterministic data migration
        run: |
          if git diff --quiet -- data/localities; then
            echo "No locality changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/localities
          git commit -m "data: refresh California SGIP records for 2026"
          git push origin HEAD:${{ github.ref_name }}
